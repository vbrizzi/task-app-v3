<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #0f172a; min-height: 100vh; padding: 24px; }
        .container { max-width: 780px; margin: 0 auto; }
        header { background: linear-gradient(135deg, #1e40af, #7c3aed); color: white; padding: 20px 24px; border-radius: 12px 12px 0 0; display: flex; align-items: center; gap: 12px; }
        header h1 { font-size: 1.4rem; flex: 1; letter-spacing: -0.5px; }
        .version-badge { background: rgba(255,255,255,0.2); color: white; font-size: 0.75rem; padding: 3px 10px; border-radius: 99px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); }
        .card { background: #1e293b; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
        .stat-box { flex: 1; text-align: center; background: #0f172a; border-radius: 8px; padding: 12px; border: 1px solid #334155; }
        .stat-num { font-size: 1.8rem; font-weight: 700; color: #818cf8; }
        .stat-label { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }
        .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 0.9rem; color: #e2e8f0; outline: none; transition: border-color .2s; }
        input[type="text"]:focus { border-color: #818cf8; }
        input[type="text"]::placeholder { color: #475569; }
        select { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 0.9rem; color: #e2e8f0; outline: none; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity .15s; }
        button:hover { opacity: 0.85; }
        .btn-add { background: linear-gradient(135deg, #1e40af, #7c3aed); color: white; }
        .btn-delete { background: #7f1d1d; color: #fca5a5; font-size: 0.78rem; padding: 4px 10px; }
        .filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 14px; border: 1px solid #334155; border-radius: 99px; background: transparent; font-size: 0.78rem; cursor: pointer; color: #94a3b8; transition: all .15s; }
        .filter-btn.active { background: #1e40af; color: white; border-color: #1e40af; }
        .search-results { margin-top: 8px; padding: 10px 14px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; font-size: 0.85rem; color: #94a3b8; display: none; }
        .search-results ul { list-style: none; margin-top: 6px; }
        .search-results li { padding: 4px 0; color: #e2e8f0; border-bottom: 1px solid #1e293b; }
        hr { border: none; border-top: 1px solid #334155; margin: 16px 0; }
        .task-list { list-style: none; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #1e293b; transition: background .15s; }
        .task-item:last-child { border-bottom: none; }
        .task-item:hover { background: #0f172a; border-radius: 6px; padding-left: 8px; }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: #818cf8; cursor: pointer; }
        .task-title { flex: 1; font-size: 0.95rem; color: #e2e8f0; cursor: pointer; }
        .task-title.done { text-decoration: line-through; color: #475569; }
        .task-meta { font-size: 0.72rem; color: #475569; margin-top: 2px; }
        .badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 99px; font-weight: 700; text-transform: uppercase; }
        .badge-alta { background: #450a0a; color: #fca5a5; }
        .badge-media { background: #451a03; color: #fdba74; }
        .badge-baja { background: #052e16; color: #86efac; }
        .empty { text-align: center; color: #475569; padding: 24px 0; font-size: 0.9rem; }
        .error-msg { color: #f87171; font-size: 0.82rem; margin-top: 4px; display: none; padding: 4px 0; }
        .progress-bar { height: 4px; background: #1e293b; border-radius: 99px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #1e40af, #7c3aed); border-radius: 99px; transition: width .4s ease; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span>✅</span>
        <h1>Task Manager</h1>
        <span class="version-badge">v3.0 — Final</span>
    </header>
    <div class="card">
        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-box"><div class="stat-num" id="statTotal">-</div><div class="stat-label">Total</div></div>
            <div class="stat-box"><div class="stat-num" id="statPend">-</div><div class="stat-label">Pendientes</div></div>
            <div class="stat-box"><div class="stat-num" id="statDone">-</div><div class="stat-label">Completadas</div></div>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

        <!-- Formulario -->
        <div class="form-row">
            <input type="text" id="newTitle" placeholder="Nueva tarea..." maxlength="200" />
            <select id="newPriority">
                <option value="alta">🔴 Alta</option>
                <option value="media" selected>🟡 Media</option>
                <option value="baja">🟢 Baja</option>
            </select>
            <button class="btn-add" onclick="addTask()">+ Agregar</button>
        </div>
        <div class="error-msg" id="errorMsg">⚠ El título no puede estar vacío.</div>

        <!-- Búsqueda en vivo -->
        <div class="form-row">
            <input type="text" id="searchInput" placeholder="Buscar en tiempo real..." oninput="searchLive()" />
        </div>
        <div class="search-results" id="searchResults"></div>

        <hr>

        <!-- Filtros -->
        <div class="filter-row">
            <button class="filter-btn active" onclick="filterTasks(null, this)">Todas</button>
            <button class="filter-btn" onclick="filterTasks('alta', this)">🔴 Alta</button>
            <button class="filter-btn" onclick="filterTasks('media', this)">🟡 Media</button>
            <button class="filter-btn" onclick="filterTasks('baja', this)">🟢 Baja</button>
            <button class="filter-btn" onclick="filterDone(false, this)">⏳ Pendientes</button>
            <button class="filter-btn" onclick="filterDone(true, this)">✅ Completadas</button>
        </div>

        <!-- Lista -->
        <ul class="task-list" id="taskList">
            <li class="empty">Cargando...</li>
        </ul>
    </div>
</div>

<script>
    let currentFilter = null;
    let currentDone = null;
    let searchTimeout = null;

    async function loadStats() {
        const res = await fetch("/api/stats");
        const s = await res.json();
        document.getElementById("statTotal").textContent = s.total;
        document.getElementById("statPend").textContent = s.pendientes;
        document.getElementById("statDone").textContent = s.completadas;
        const pct = s.total > 0 ? Math.round((s.completadas / s.total) * 100) : 0;
        document.getElementById("progressFill").style.width = pct + "%";
    }

    async function loadTasks() {
        let url = "/api/tasks";
        const params = [];
        if (currentFilter) params.push("priority=" + currentFilter);
        if (currentDone !== null) params.push("done=" + currentDone);
        if (params.length) url += "?" + params.join("&");
        const res = await fetch(url);
        renderTasks(await res.json());
    }

    function renderTasks(tasks) {
        const list = document.getElementById("taskList");
        if (!tasks.length) { list.innerHTML = '<li class="empty">No hay tareas.</li>'; return; }
        list.innerHTML = tasks.map(t => `
            <li class="task-item">
                <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${t.id}, this.checked)">
                <div style="flex:1">
                    <div class="task-title ${t.done ? "done" : ""}">${t.title}</div>
                    <div class="task-meta">${new Date(t.createdAt).toLocaleDateString("es-AR")}</div>
                </div>
                <span class="badge badge-${t.priority}">${t.priority}</span>
                <button class="btn-delete" onclick="deleteTask(${t.id})">Eliminar</button>
            </li>`).join("");
    }

    async function addTask() {
        const title = document.getElementById("newTitle").value.trim();
        const priority = document.getElementById("newPriority").value;
        const errorEl = document.getElementById("errorMsg");
        if (!title) { errorEl.style.display = "block"; return; }
        errorEl.style.display = "none";
        await fetch("/api/tasks", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ title, priority }) });
        document.getElementById("newTitle").value = "";
        refresh();
    }

    async function deleteTask(id) {
        await fetch("/api/tasks/" + id, { method: "DELETE" });
        refresh();
    }

    async function toggleTask(id, done) {
        await fetch("/api/tasks/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ done }) });
        refresh();
    }

    function searchLive() {
        clearTimeout(searchTimeout);
        const q = document.getElementById("searchInput").value.trim();
        const div = document.getElementById("searchResults");
        if (!q) { div.style.display = "none"; return; }
        searchTimeout = setTimeout(async () => {
            const res = await fetch("/api/tasks/search?q=" + encodeURIComponent(q));
            const results = await res.json();
            div.style.display = "block";
            div.innerHTML = results.length
                ? `<strong style="color:#818cf8">${results.length} resultado(s):</strong><ul>${results.map(t => `<li>${t.title}</li>`).join("")}</ul>`
                : `<span>Sin resultados para "<em>${q}</em>"</span>`;
        }, 250);
    }

    function filterTasks(priority, btn) {
        currentFilter = priority;
        currentDone = null;
        setActiveBtn(btn);
        loadTasks();
    }

    function filterDone(done, btn) {
        currentFilter = null;
        currentDone = done;
        setActiveBtn(btn);
        loadTasks();
    }

    function setActiveBtn(btn) {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
    }

    function refresh() { loadTasks(); loadStats(); }

    document.getElementById("newTitle").addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

    refresh();
</script>
</body>
</html>
